<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Registration Form — Solution</title>
</head>
<body>

  <h1>Course Registration Form</h1>
  <p>Fill in the form below to register for a course at Get Techy with Lucky.</p>

  <form action="/register" method="POST">

    <!-- Student Information -->
    <fieldset>
      <legend>Student Information</legend>

      <label for="fullname">Full Name:</label><br>
      <input type="text" id="fullname" name="fullname" required minlength="2" maxlength="100" placeholder="Enter your full name"><br><br>

      <label for="email">Email Address:</label><br>
      <input type="email" id="email" name="email" required placeholder="you@example.com"><br><br>

      <label for="phone">Phone Number:</label><br>
      <input type="tel" id="phone" name="phone" required placeholder="+254 700 000 000"><br><br>

      <label for="dob">Date of Birth:</label><br>
      <input type="date" id="dob" name="dob" required><br>
    </fieldset>

    <br>

    <!-- Course Selection -->
    <fieldset>
      <legend>Course Selection</legend>

      <label for="course">Choose a Course:</label><br>
      <select id="course" name="course" required>
        <option value="">-- Choose a course --</option>
        <option value="digital-foundations">Digital Foundations</option>
        <option value="tools-of-the-trade">Tools of the Trade</option>
        <option value="html-essentials">Web Fundamentals — HTML</option>
        <option value="css-styling">Web Styling — CSS</option>
        <option value="javascript">Frontend JavaScript</option>
        <option value="frontend-mastery">Frontend Mastery — React</option>
        <option value="backend">Backend — Node.js & APIs</option>
        <option value="databases">Databases</option>
      </select>
    </fieldset>

    <br>

    <!-- Schedule Preference -->
    <fieldset>
      <legend>Schedule Preference</legend>

      <label><input type="radio" name="schedule" value="morning" required> Morning (8am — 12pm)</label><br>
      <label><input type="radio" name="schedule" value="afternoon"> Afternoon (1pm — 5pm)</label><br>
      <label><input type="radio" name="schedule" value="evening"> Evening (6pm — 9pm)</label>
    </fieldset>

    <br>

    <!-- Skills -->
    <fieldset>
      <legend>Current Skills (select all that apply)</legend>

      <label><input type="checkbox" name="skills" value="html"> HTML</label><br>
      <label><input type="checkbox" name="skills" value="css"> CSS</label><br>
      <label><input type="checkbox" name="skills" value="javascript"> JavaScript</label><br>
      <label><input type="checkbox" name="skills" value="python"> Python</label><br>
      <label><input type="checkbox" name="skills" value="git"> Git & GitHub</label><br>
      <label><input type="checkbox" name="skills" value="react"> React</label><br>
      <label><input type="checkbox" name="skills" value="nodejs"> Node.js</label><br>
      <label><input type="checkbox" name="skills" value="sql"> SQL / Databases</label>
    </fieldset>

    <br>

    <!-- Motivation -->
    <fieldset>
      <legend>Motivation</legend>

      <label for="motivation">Why do you want to learn to code?</label><br>
      <textarea id="motivation" name="motivation" rows="5" cols="50" required
        placeholder="Tell us about your goals and what inspired you to start learning..."></textarea>
    </fieldset>

    <br>

    <!-- Terms -->
    <label>
      <input type="checkbox" name="terms" required>
      I accept the <a href="terms.html">terms and conditions</a>
    </label>

    <br><br>

    <!-- Buttons -->
    <button type="submit">Submit Registration</button>
    <button type="reset">Reset Form</button>

  </form>

</body>
</html>
