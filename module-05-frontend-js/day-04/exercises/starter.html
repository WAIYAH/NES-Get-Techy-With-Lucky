<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 04 — Events Exercise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background: #f5f5f5;
      transition: background-color 0.3s, color 0.3s;
    }
    h1 { margin-bottom: 1rem; }
    section { margin-bottom: 2rem; padding: 1.5rem; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    section h2 { margin-bottom: 1rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; border: none; border-radius: 4px; background: #3498db; color: white; font-size: 1rem; }
    button:hover { background: #2980b9; }
    input, textarea { padding: 0.5rem; font-size: 1rem; border: 1px solid #ddd; border-radius: 4px; width: 100%; margin-bottom: 0.5rem; }
    .counter-display { font-size: 2rem; font-weight: bold; margin: 1rem 0; }
    .dark-mode { background: #1a1a2e; color: #e0e0e0; }
    .dark-mode section { background: #16213e; }
    .char-info { color: #666; font-size: 0.9rem; }
    .error { color: #e74c3c; font-size: 0.9rem; margin-top: 0.25rem; }
    .success { color: #27ae60; font-size: 0.9rem; margin-top: 0.25rem; }
    ul { list-style: none; margin-top: 1rem; }
    ul li { padding: 0.5rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .completed { text-decoration: line-through; color: #999; }
    .delete-btn { background: #e74c3c; padding: 0.25rem 0.5rem; font-size: 0.8rem; }
  </style>
</head>
<body>

  <h1>Events & Interactivity</h1>

  <!-- ============================================
    TASK 1: Click Counter
  ============================================ -->
  <section>
    <h2>Task 1: Click Counter</h2>
    <div class="counter-display" id="counter">0</div>
    <button id="increment-btn">Click Me!</button>
    <!-- Add an event listener to the button that increments the counter -->
  </section>

  <!-- ============================================
    TASK 2: Dark Mode Toggle
  ============================================ -->
  <section>
    <h2>Task 2: Dark Mode Toggle</h2>
    <button id="theme-toggle">Toggle Dark Mode</button>
    <!-- Add an event listener that toggles the "dark-mode" class on the body -->
  </section>

  <!-- ============================================
    TASK 3: Character Counter
  ============================================ -->
  <section>
    <h2>Task 3: Character Counter</h2>
    <textarea id="message" maxlength="200" placeholder="Type your message..."></textarea>
    <p class="char-info"><span id="char-count">0</span> / 200 characters</p>
    <!-- Add an event listener on the textarea that updates the character count -->
  </section>

  <!-- ============================================
    TASK 4: Form Validation
  ============================================ -->
  <section>
    <h2>Task 4: Form Validation</h2>
    <form id="signup-form">
      <input type="text" id="name" placeholder="Full Name">
      <div id="name-error" class="error"></div>

      <input type="email" id="email" placeholder="Email Address">
      <div id="email-error" class="error"></div>

      <input type="password" id="password" placeholder="Password (min 8 characters)">
      <div id="password-error" class="error"></div>

      <button type="submit">Sign Up</button>
      <div id="form-success" class="success"></div>
    </form>
    <!-- Validate on submit:
         - Name must not be empty
         - Email must contain @
         - Password must be at least 8 characters
         Show error messages in the DOM (not alerts) -->
  </section>

  <!-- ============================================
    TASK 5: Interactive To-Do List
  ============================================ -->
  <section>
    <h2>Task 5: Interactive To-Do List</h2>
    <input type="text" id="todo-input" placeholder="Add a task and press Enter...">
    <ul id="todo-list">
      <!-- Items will be added here by JavaScript -->
    </ul>
    <!-- Requirements:
         - Press Enter to add a new item
         - Click an item to toggle "completed" style
         - Click the delete button to remove an item -->
  </section>

</body>
</html>
