  Module 05: Frontend JavaScript

============================================ -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 05 — Fetch API Solution</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 2rem; background: #f5f5f5; }
    h1 { margin-bottom: 1rem; }
    section { margin-bottom: 2rem; padding: 1.5rem; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    section h2 { margin-bottom: 1rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; border: none; border-radius: 4px; background: #3498db; color: white; font-size: 1rem; margin-bottom: 1rem; }
    button:hover { background: #2980b9; }
    input { padding: 0.5rem; font-size: 1rem; border: 1px solid #ddd; border-radius: 4px; width: 100%; margin-bottom: 1rem; }
    .user-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 1rem;
      margin: 0.5rem 0;
    }
    .user-card h3 { color: #2c3e50; margin-bottom: 0.5rem; }
    .user-card p { color: #555; font-size: 0.9rem; }
    .dog-image { max-width: 300px; border-radius: 8px; margin: 1rem 0; }
    .error { color: #e74c3c; padding: 1rem; background: #fde8e8; border-radius: 4px; }
    .loading { color: #666; font-style: italic; }
    .post-card { border-left: 4px solid #3498db; padding: 1rem; margin: 0.5rem 0; }
    .post-card h3 { margin-bottom: 0.5rem; }
  </style>
</head>
<body>

  <h1>Fetch API — Getting Data from the Internet</h1>

  <!-- TASK 1 -->
  <section>
    <h2>Task 1: Fetch and Log</h2>
    <button id="fetch-post-btn">Fetch Post #1</button>
    <div id="post-container"></div>
  </section>

  <!-- TASK 2 -->
  <section>
    <h2>Task 2: User List</h2>
    <button id="fetch-users-btn">Load Users</button>
    <div id="user-container"></div>
  </section>

  <!-- TASK 3 -->
  <section>
    <h2>Task 3: Random Dog</h2>
    <button id="fetch-dog-btn">Get Random Dog</button>
    <div id="dog-container"></div>
  </section>

  <!-- TASK 4 -->
  <section>
    <h2>Task 4: Error Handling</h2>
    <button id="fetch-error-btn">Fetch from Invalid URL</button>
    <div id="error-container"></div>
  </section>

  <!-- TASK 5 -->
  <section>
    <h2>Task 5: Search Users</h2>
    <input type="text" id="search-input" placeholder="Search users by name...">
    <div id="search-container"></div>
  </section>

  <script>
    // ============================================
    // TASK 1: Fetch and Log a Post
    // ============================================

    document.querySelector("#fetch-post-btn").addEventListener("click", async () => {
      const container = document.querySelector("#post-container");
      container.innerHTML = '<p class="loading">Loading...</p>';

      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/posts/1");

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const post = await response.json();

        container.innerHTML = `
          <div class="post-card">
            <h3>${post.title}</h3>
            <p>${post.body}</p>
          </div>
        `;
      } catch (error) {
        container.innerHTML = `<p class="error">Failed to load post: ${error.message}</p>`;
      }
    });


    // ============================================
    // TASK 2: Display User List
    // ============================================

    document.querySelector("#fetch-users-btn").addEventListener("click", async () => {
      const container = document.querySelector("#user-container");
      container.innerHTML = '<p class="loading">Loading users...</p>';

      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/users");

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const users = await response.json();
        container.innerHTML = "";

        users.forEach(user => {
          const card = document.createElement("div");
          card.classList.add("user-card");
          card.innerHTML = `
            <h3>${user.name}</h3>
            <p>Email: ${user.email}</p>
            <p>City: ${user.address.city}</p>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        container.innerHTML = `<p class="error">Failed to load users: ${error.message}</p>`;
      }
    });


    // ============================================
    // TASK 3: Random Dog Image
    // ============================================

    document.querySelector("#fetch-dog-btn").addEventListener("click", async () => {
      const container = document.querySelector("#dog-container");
      container.innerHTML = '<p class="loading">Fetching a good boy...</p>';

      try {
        const response = await fetch("https://dog.ceo/api/breeds/image/random");

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();

        const img = document.createElement("img");
        img.src = data.message;
        img.alt = "A random dog";
        img.classList.add("dog-image");

        container.innerHTML = "";
        container.appendChild(img);
      } catch (error) {
        container.innerHTML = `<p class="error">Failed to fetch dog: ${error.message}</p>`;
      }
    });


    // ============================================
    // TASK 4: Error Handling
    // ============================================

    document.querySelector("#fetch-error-btn").addEventListener("click", async () => {
      const container = document.querySelector("#error-container");
      container.innerHTML = '<p class="loading">Attempting to fetch...</p>';

      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/invalid-endpoint-12345");

        if (!response.ok) {
          throw new Error(`Server responded with status ${response.status}`);
        }

        const data = await response.json();
        container.innerHTML = `<p>Data received: ${JSON.stringify(data)}</p>`;
      } catch (error) {
        container.innerHTML = `
          <div class="error">
            <strong>Oops! Something went wrong.</strong>
            <p>We couldn't load the data. Please check your internet connection and try again.</p>
            <p><small>Error details: ${error.message}</small></p>
          </div>
        `;
      }
    });


    // ============================================
    // TASK 5: Search/Filter Users
    // ============================================

    let allUsers = [];

    // Fetch users once on page load
    async function loadUsers() {
      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/users");

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        allUsers = await response.json();
        renderUsers(allUsers);
      } catch (error) {
        document.querySelector("#search-container").innerHTML =
          `<p class="error">Failed to load users: ${error.message}</p>`;
      }
    }

    function renderUsers(users) {
      const container = document.querySelector("#search-container");
      container.innerHTML = "";

      if (users.length === 0) {
        container.innerHTML = "<p>No users found matching your search.</p>";
        return;
      }

      users.forEach(user => {
        const card = document.createElement("div");
        card.classList.add("user-card");
        card.innerHTML = `
          <h3>${user.name}</h3>
          <p>Email: ${user.email}</p>
          <p>City: ${user.address.city}</p>
        `;
        container.appendChild(card);
      });
    }

    // Filter on input
    document.querySelector("#search-input").addEventListener("input", (event) => {
      const searchTerm = event.target.value.toLowerCase();
      const filtered = allUsers.filter(user =>
        user.name.toLowerCase().includes(searchTerm)
      );
      renderUsers(filtered);
    });

    // Load users when page opens
    loadUsers();
  </script>
</body>
</html>
