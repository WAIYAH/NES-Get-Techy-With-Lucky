<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 03 — DOM Manipulation Solution</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 2rem; background: #f5f5f5; }
    h1 { margin-bottom: 1rem; }
    p { margin-bottom: 0.5rem; }
    .highlight { background-color: #ffd700; padding: 0.25rem 0.5rem; border-radius: 4px; }
    ul { list-style: inside; margin: 1rem 0; }
    .card {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin: 1rem 0;
      max-width: 400px;
    }
    .card h3 { margin-bottom: 0.5rem; color: #2c3e50; }
    .card p { color: #555; }
  </style>
</head>
<body>

  <h1 id="main-title">My DOM Playground</h1>

  <p class="intro">This is the first paragraph.</p>
  <p class="content">This is the second paragraph.</p>
  <p class="content">This is the third paragraph.</p>

  <ul id="language-list">
    <!-- Languages will be added here by JavaScript -->
  </ul>

  <button id="toggle-btn">Toggle Highlight</button>

  <div id="card-container">
    <!-- A card will be created here by JavaScript -->
  </div>

  <script>
    // ============================================
    // TASK 1: Select and Log
    // ============================================

    // 1a. Select the heading by ID and log its text content
    const heading = document.getElementById("main-title");
    console.log("Heading text:", heading.textContent);

    // 1b. Select ALL paragraphs and log how many there are
    const allParagraphs = document.querySelectorAll("p");
    console.log("Number of paragraphs:", allParagraphs.length);


    // ============================================
    // TASK 2: Change Content and Style
    // ============================================

    // 2a. Change the heading text
    heading.textContent = "Welcome to JavaScript DOM!";

    // 2b. Change the first paragraph's content
    const firstParagraph = document.querySelector(".intro");
    firstParagraph.textContent = "I just changed this paragraph with JavaScript!";

    // 2c. Change the second paragraph's colour to blue
    const secondParagraph = document.querySelector(".content");
    secondParagraph.style.color = "blue";


    // ============================================
    // TASK 3: Toggle a Class
    // ============================================

    const toggleBtn = document.querySelector("#toggle-btn");
    toggleBtn.addEventListener("click", () => {
      heading.classList.toggle("highlight");
    });


    // ============================================
    // TASK 4: Build a List Dynamically
    // ============================================

    const languages = ["JavaScript", "Python", "Rust", "Go", "TypeScript"];
    const list = document.querySelector("#language-list");

    languages.forEach(lang => {
      const li = document.createElement("li");
      li.textContent = lang;
      list.appendChild(li);
    });


    // ============================================
    // TASK 5: Create a Card with JavaScript
    // ============================================

    const card = document.createElement("div");
    card.classList.add("card");

    const cardTitle = document.createElement("h3");
    cardTitle.textContent = "Lucky Ochieng";

    const cardBio = document.createElement("p");
    cardBio.textContent = "Tech educator and web developer. Passionate about making technology accessible to everyone in Africa and beyond.";

    card.appendChild(cardTitle);
    card.appendChild(cardBio);

    const container = document.querySelector("#card-container");
    container.appendChild(card);
  </script>
</body>
</html>
