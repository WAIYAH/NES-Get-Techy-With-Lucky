<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky | Developer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 32px;
        }
        .links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            color: #f8fafc;
            text-decoration: none;
            border: 1px solid #475569;
            padding: 12px 24px;
            border-radius: 8px;
            transition: background 0.2s, border-color 0.2s;
        }
        .links a:hover {
            background: #334155;
            border-color: #60a5fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lucky</h1>
        <p class="tagline">Full-Stack Developer | Building the web, one line at a time.</p>

        <div class="links">
            <a href="https://github.com/your-username" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://linkedin.com/in/your-profile" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="mailto:your-email@example.com">Email Me</a>
        </div>
    </div>
</body>
</html>
