<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Day 01 — Starter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to CSS</h1>

    <p>This is the first paragraph. Style it with a different colour.</p>
    <p>This is the second paragraph. Try changing the font size.</p>
    <p class="highlight">This paragraph has a class. Give it a background colour.</p>

    <div class="card">
        <h2>My First Card</h2>
        <p>Use the box model to add padding, border, and margin to this card.</p>
    </div>

    <!-- 
        TASKS:
        1. Create a style.css file in the same folder
        2. Set the body font to Arial, sans-serif
        3. Change the h1 colour to a dark shade
        4. Centre-align the h1
        5. Give the .highlight class a yellow background
        6. Style the .card with:
           - White background
           - 20px padding
           - 1px solid #ddd border
           - 8px border-radius
           - 20px margin on top and bottom
        7. Add box-sizing: border-box to everything using * selector
    -->
</body>
</html>
